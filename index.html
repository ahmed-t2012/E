<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحميل تطبيقنا الذكي</title>
    
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* الحاوية الرئيسية للموقع */
        .main-container {
            background-color: #1e293b;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            max-width: 900px;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            overflow: hidden;
            border: 1px solid #334155;
        }

        /* القسم الأيمن: استعراض التطبيق */
        .app-showcase {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
        }

        .app-logo {
            font-size: 60px;
            margin-bottom: 20px;
        }

        .app-title {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 15px;
        }

        .app-tagline {
            font-size: 16px;
            line-height: 1.6;
            opacity: 0.9;
            margin-bottom: 30px;
        }

        .app-features .feature {
            font-size: 14px;
            margin-bottom: 12px;
            background: rgba(255, 255, 255, 0.1);
            padding: 8px 15px;
            border-radius: 8px;
        }

        /* القسم الأيسر: أزرار التحميل */
        .download-section {
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .download-section h2 {
            font-size: 22px;
            margin-bottom: 25px;
            color: #f1f5f9;
            text-align: center;
        }

        .buttons-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* كرت زر التحميل */
        .dl-card {
            display: flex;
            align-items: center;
            background-color: #334155;
            border: 2px solid transparent;
            padding: 20px;
            border-radius: 16px;
            text-decoration: none;
            color: white;
            transition: all 0.3s ease;
        }

        .dl-card:hover {
            background-color: #475569;
            transform: translateY(-2px);
        }

        .os-icon {
            font-size: 35px;
            margin-left: 20px;
        }

        .dl-info {
            display: flex;
            flex-direction: column;
        }

        .os-name {
            font-size: 18px;
            font-weight: bold;
        }

        .file-ext {
            font-size: 13px;
            color: #94a3b8;
            margin-top: 4px;
        }

        /* ميزة التمييز الذكي للزر الموصى به حسب جهاز الزائر */
        .recommended {
            border-color: #10b981;
            background-color: #064e3b;
            position: relative;
        }

        .recommended:hover {
            background-color: #047857;
        }

        .recommended::after {
            content: "موصى به لجهازك";
            position: absolute;
            top: -12px;
            left: 20px;
            background-color: #10b981;
            color: white;
            font-size: 11px;
            padding: 2px 10px;
            border-radius: 10px;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .security-notice {
            font-size: 12px;
            color: #64748b;
            text-align: center;
            margin-top: 30px;
        }

        /* جعل التصميم متجاوباً على الهواتف */
        @media (max-width: 768px) {
            .main-container {
                grid-template-columns: 1fr;
            }
            .app-showcase {
                align-items: center;
                text-align: center;
                padding: 30px 20px;
            }
            .download-section {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>

    <div class="main-container">
        
        <div class="app-showcase">
            <div class="app-logo">🚀</div>
            <h1 class="app-title">تطبيق لتشفير الرسائل </h1>
            <p class="app-tagline">الأداة سهلة لتشفير النصوص والملفات بسهولة</p>
            
            <div class="app-features">
                <div class="feature">🔹 حماية وتشفير عالي للمعلومات</div>
                <div class="feature">🔹 واجهة استخدام سهلة </div>
                <div class="feature">🔹 يعمل علي الاندريد والكومبيوتر بكل سهولة</div>
            </div>
        </div>

        
        <div class="download-section">
            <h2>اختر نسختك وابدأ التحميل</h2>
            
            <div class="buttons-container">
                <!-- زر نسخة الكمبيوتر (Windows EXE) -->
                <a href="app.exe" download="app.exe" id="win-btn" class="dl-card">
                    <div class="os-icon">💻</div>
                    <div class="dl-info">
                        <span class="os-name">نسخة الكمبيوتر</span>
                        <span class="file-ext">Windows (.EXE)</span>
                    </div>
                </a>

                
                <a href="app.apk" download="app.apk" id="android-btn" class="dl-card">
                    <div class="os-icon">🤖</div>
                    <div class="dl-info">
                        <span class="os-name">نسخة الأندرويد</span>
                        <span class="file-ext">Android (.APK)</span>
                    </div>
                </a>
            </div>

            <p class="security-notice">🔒 جميع الملفات مفحوصة وآمنة 100% ضد الفيروسات.</p>
        </div>
    </div>

    
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const userAgent = navigator.userAgent.toLowerCase();
            const winBtn = document.getElementById('win-btn');
            const androidBtn = document.getElementById('android-btn');

            if (userAgent.includes('win')) {
                winBtn.classList.add('recommended');
            } else if (userAgent.includes('android') || userAgent.includes('iphone') || userAgent.includes('ipad')) {
                androidBtn.classList.add('recommended');
            }
        });
    </script>
</body>
</html>
